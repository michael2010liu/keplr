<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  /* Base design system — matches substrate-osmosis.html */
  --ink: #0f0e0c;
  --paper: #f5f2ed;
  --cream: #ede8e0;
  --rule: rgba(15,14,12,0.12);
  --rule-mid: rgba(15,14,12,0.22); /* new — not in osmosis */
  --muted: #6b6860;
  --teal: #0d7a6e;
  --teal-pale: #d4eeeb;
  --teal-mid: #1a9d8f;
  --amber: #d4820a;
  --amber-pale: #fdf3dc;
  --coral: #c94f2c;
  --coral-pale: #fde8e0;
  --blue: #1a5fa8;
  --blue-pale: #ddeaf9;
  --serif: 'DM Serif Display', Georgia, 'Times New Roman', serif;
  --mono: 'DM Mono', 'Courier New', Courier, monospace;
  --sans: 'Instrument Sans', system-ui, -apple-system, sans-serif;

  /* Organelle fill colors */
  --org-nucleus: #1a5fa8;
  --org-mito: #d4820a;
  --org-rer: #0d7a6e;
  --org-ser: #c94f2c;
  --org-golgi: #7a3ca8;
  --org-ribo: #6b8a10;
  --org-lyso: #4f3ca8;
  --org-vacuole: #0a7a7a;
  --org-chloro: #2d7a3a;
  --org-nucleoid: #3a6b2a;
  --org-plasmid: #b5600a;
  --org-flagellum: #6b6860;
  --org-membrane: #0f0e0c;
  --org-wall: #0f0e0c;

  /* Organelle pale (badge backgrounds) */
  --org-nucleus-pale: #ddeaf9;
  --org-mito-pale: #fdf3dc;
  --org-rer-pale: #d4eeeb;
  --org-ser-pale: #fde8e0;
  --org-golgi-pale: #ede8f8;
  --org-ribo-pale: #eef4d0;
  --org-lyso-pale: #e8e4f8;
  --org-vacuole-pale: #cceeed;
  --org-chloro-pale: #d4edda;
  --org-nucleoid-pale: #d8eccc;
  --org-plasmid-pale: #f5e2cc;
}

html, body { height: 100%; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.6;
  overflow-x: hidden;
}

/* ── TOPBAR ── */
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0.9rem 2rem;
  border-bottom: 1px solid var(--rule);
  background: var(--paper);
  position: sticky;
  top: 0;
  z-index: 50;
}
.topbar-left { display: flex; align-items: center; gap: 1.25rem; }
.brand { font-family: var(--serif); font-size: 1.1rem; color: var(--ink); text-decoration: none; }
.breadcrumb {
  display: flex; align-items: center; gap: 0.5rem;
  font-family: var(--mono); font-size: 0.68rem; letter-spacing: 0.06em; color: var(--muted);
}
.breadcrumb-sep { opacity: 0.4; }

/* ── LAYOUT ── */
.main {
  display: flex;
  gap: 0;
  min-height: calc(100vh - 56px - 120px); /* 56px topbar + ~120px page-intro */
}
.viewer-col {
  flex: 0 0 60%;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding: 2rem;
  border-right: 1px solid var(--rule);
}
.svg-wrapper {
  width: 100%;
  aspect-ratio: 6 / 5;
  position: relative;
  overflow: hidden;
}
.cell-svg {
  width: 100%;
  height: 100%;
  display: block;
  transition: opacity 0.4s ease;
}
.sidebar {
  flex: 0 0 40%;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.cell-tabs {
  display: flex;
  border-bottom: 1px solid var(--rule);
  flex-shrink: 0;
}
.cell-tab {
  flex: 1;
  padding: 0.75rem 1rem;
  font-family: var(--mono);
  font-size: 0.68rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
  background: transparent;
  border: none;
  border-bottom: 2px solid transparent;
  cursor: pointer;
  transition: color 0.15s, border-color 0.15s;
}
.cell-tab:hover { color: var(--ink); }
.cell-tab.active { color: var(--ink); border-bottom-color: var(--ink); }
.info-panel {
  padding: 1.5rem;
  min-height: 180px;
  border-bottom: 1px solid var(--rule);
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
}
.info-default {
  font-style: italic;
  color: var(--muted);
  text-align: center;
}
.organelle-list-region {
  flex: 1;
  overflow-y: auto;
  padding: 0.5rem 0;
}
.organelle-list {
  list-style: none;
  margin: 0;
  padding: 0;
}
.organelle-list-item {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  padding: 0.6rem 1.5rem;
  cursor: pointer;
  font-size: 0.875rem;
  transition: background 0.12s;
  border-left: 3px solid transparent;
}
.organelle-list-item:hover { background: var(--cream); }
.organelle-list-item.active { background: var(--cream); }
.org-dot {
  width: 12px; height: 12px;
  border-radius: 50%;
  flex-shrink: 0;
}
.info-name {
  font-family: var(--serif);
  font-size: 1.5rem;
  margin-bottom: 0.4rem;
}
.info-badge {
  display: inline-block;
  padding: 0.15rem 0.6rem;
  border-radius: 999px;
  font-family: var(--mono);
  font-size: 0.65rem;
  letter-spacing: 0.06em;
  margin-bottom: 0.75rem;
  border: 1px solid transparent;
}
.info-nickname {
  font-family: var(--mono);
  font-size: 0.75rem;
  color: var(--muted);
  margin-bottom: 0.6rem;
}
.info-desc {
  font-size: 0.9rem;
  line-height: 1.65;
  color: var(--ink);
  margin-bottom: 0.75rem;
}
.info-found {
  font-family: var(--mono);
  font-size: 0.68rem;
  letter-spacing: 0.05em;
  color: var(--muted);
}
.org-group { transition: opacity 0.25s ease; }
.org-group.dimmed { opacity: 0.3; pointer-events: none; }

/* ── AMBIENT ANIMATIONS ── */
@keyframes orgPulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.03); }
}
@keyframes mitoGlow {
  0%, 100% { filter: drop-shadow(0 0 2px var(--org-mito)); }
  50% { filter: drop-shadow(0 0 8px var(--org-mito)); }
}

/* Apply ambient pulse to all organelle groups except when dimmed */
.org-group:not(.dimmed) {
  transform-box: fill-box;
  transform-origin: center;
  animation: orgPulse 3s ease-in-out infinite;
}
/* Stagger each group's delay via nth-child */
.org-group:nth-child(1):not(.dimmed) { animation-delay: 0s; }
.org-group:nth-child(2):not(.dimmed) { animation-delay: 0.4s; }
.org-group:nth-child(3):not(.dimmed) { animation-delay: 0.8s; }
.org-group:nth-child(4):not(.dimmed) { animation-delay: 1.2s; }
.org-group:nth-child(5):not(.dimmed) { animation-delay: 1.6s; }
.org-group:nth-child(6):not(.dimmed) { animation-delay: 2.0s; }
.org-group:nth-child(7):not(.dimmed) { animation-delay: 2.4s; }
.org-group:nth-child(8):not(.dimmed) { animation-delay: 2.8s; }
.org-group:nth-child(9):not(.dimmed) { animation-delay: 0.6s; }
.org-group:nth-child(10):not(.dimmed) { animation-delay: 1.0s; }

/* Mitochondria extra glow */
[data-organelle-id="mito"]:not(.dimmed) {
  animation: orgPulse 3s ease-in-out infinite, mitoGlow 4s ease-in-out infinite;
  animation-delay: 0.8s, 1s;
}

/* ── FUNCTIONAL ANIMATIONS (triggered on selection) ── */

/* Nucleus: DNA helix lines animate */
@keyframes dnaSlide { to { stroke-dashoffset: 40; } }
.anim-nucleus .dna-line { animation: dnaSlide 1.5s linear infinite; }
.anim-nucleus circle:nth-child(3) { fill-opacity: 0.7 !important; }

/* Mitochondria: intensified glow */
@keyframes mitoSelected {
  0%, 100% { filter: drop-shadow(0 0 10px var(--org-mito)); }
  50% { filter: drop-shadow(0 0 22px var(--org-mito)); }
}
.anim-mito { animation: mitoSelected 1s ease-in-out infinite !important; }

/* Rough ER: travelling dot — motion uses begin="0s" in SVG markup, CSS just shows the dot */
.anim-rer .rer-dot { opacity: 1 !important; }

/* Smooth ER: stroke color pulse */
@keyframes serPulse {
  0%, 100% { stroke: var(--org-ser); }
  50% { stroke: #f0a090; }
}
.anim-ser path { animation: serPulse 1.5s ease-in-out infinite; }

/* Golgi: vesicle budding */
@keyframes vesicleOut {
  0% { transform: translate(0, 0); opacity: 0.8; }
  100% { transform: translate(20px, -15px); opacity: 0; }
}
.anim-golgi .golgi-vesicle { animation: vesicleOut 1.5s ease-out infinite; fill-opacity: 0.8 !important; }
.anim-golgi .golgi-vesicle:nth-of-type(2) { animation-delay: 0.5s; }
.anim-golgi .golgi-vesicle:nth-of-type(3) { animation-delay: 1s; }

/* Ribosomes: brighten group */
@keyframes riboBright { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }
.anim-ribo circle { animation: riboBright 0.8s ease-in-out infinite !important; }

/* Lysosome: pulsing glow */
@keyframes lysoGlow {
  0%, 100% { filter: drop-shadow(0 0 3px var(--org-lyso)); }
  50% { filter: drop-shadow(0 0 12px var(--org-lyso)); }
}
.anim-lyso { animation: lysoGlow 1.2s ease-in-out infinite !important; }

/* Vacuole: ripple ring — use scale() since SVG 'r' can't be animated via CSS */
@keyframes vacuoleRipple {
  0%   { transform: scale(1);   opacity: 0.8; }
  100% { transform: scale(1.8); opacity: 0; }
}
.anim-vacuole .vacuole-ripple {
  animation: vacuoleRipple 1.5s ease-out infinite;
  opacity: 1 !important;
  transform-box: fill-box;
  transform-origin: center;
}

/* Nucleoid: opacity pulse */
@keyframes nucleoidPulse { 0%, 100% { fill-opacity: 0.25; } 50% { fill-opacity: 0.55; } }
.anim-nucleoid path { animation: nucleoidPulse 1.2s ease-in-out infinite; }

/* Flagellum: wave motion */
@keyframes flagWave { to { stroke-dashoffset: 200; } }
.anim-flagellum path { animation: flagWave 1s linear infinite; }

/* Plasmid: slow spin */
@keyframes plasmidSpin { to { transform: rotate(360deg); } }
.anim-plasmid {
  animation: plasmidSpin 4s linear infinite !important;
  transform-box: fill-box;
  transform-origin: center;
}

/* Cell membrane: stroke-width pulse */
@keyframes membraneGlow { 0%, 100% { stroke-width: 3; } 50% { stroke-width: 6; } }
.anim-membrane path, .anim-membrane ellipse, .anim-membrane rect { animation: membraneGlow 1s ease-in-out infinite; }

/* Cell wall: stroke-width pulse (slower) */
@keyframes wallGlow { 0%, 100% { stroke-width: 8; } 50% { stroke-width: 14; } }
.anim-wall rect, .anim-wall ellipse { animation: wallGlow 1.5s ease-in-out infinite; }

/* Chloroplast: flash */
@keyframes chloroFlash {
  0%, 100% { filter: brightness(1) drop-shadow(0 0 4px var(--org-chloro)); }
  50% { filter: brightness(1.8) drop-shadow(0 0 16px var(--org-chloro)); }
}
.anim-chloro { animation: chloroFlash 1.2s ease-in-out infinite !important; }

/* ── FINAL POLISH ── */
.org-group { cursor: pointer; }
.org-group:hover:not(.dimmed) { opacity: 0.85; }

.page-intro {
  padding: 2rem 2rem 0;
  border-bottom: 1px solid var(--rule);
  max-width: 560px;
}
.page-title {
  font-family: var(--serif);
  font-size: clamp(1.8rem, 3vw, 2.8rem);
  line-height: 1.1;
  letter-spacing: -0.02em;
  margin-bottom: 0.5rem;
}
.page-title em { font-style: italic; color: var(--teal); }
.page-sub {
  font-size: 0.9rem;
  color: var(--muted);
  line-height: 1.6;
  margin-bottom: 1.5rem;
}

@media (max-width: 768px) {
  .main { flex-direction: column; }
  .viewer-col { flex: none; width: 100%; border-right: none; border-bottom: 1px solid var(--rule); }
  .sidebar { flex: none; width: 100%; }
  .organelle-list-region { max-height: 300px; }
}
</style>

<script>
const ORGANELLES = [
  {

let currentCell = 'animal';
let selectedId = null;
let renderTimer = null;

function renderCell(type) {
  const svg = document.getElementById('cellSvg');
  if (renderTimer) clearTimeout(renderTimer);
  // Snap to invisible with no transition so rapid switches don't stack fades
  svg.style.transition = 'none';
  svg.style.opacity = '0';
  renderTimer = setTimeout(() => {
    if (type === 'animal') svg.innerHTML = renderAnimalCell();
    else if (type === 'plant') svg.innerHTML = renderPlantCell();
    else svg.innerHTML = renderProkaryoteCell();
    currentCell = type;
    clearSelection();
    renderOrganelleList(type);
    attachSvgListeners();
    // Re-enable transition then fade in
    svg.style.transition = '';
    svg.style.opacity = '1';
  }, 200);
}

// ── Task 10: Click Interaction + Info Panel ──

function clearSelection() {
  selectedId = null;
  document.getElementById('infoPanel').innerHTML = '<p class="info-default">Click any organelle to explore it.</p>';
  document.querySelectorAll('.org-group').forEach(g => {
    g.classList.remove('dimmed');
    [...g.classList].filter(c => c.startsWith('anim-')).forEach(c => g.classList.remove(c));
  });
  document.querySelectorAll('.organelle-list-item').forEach(li => {
    li.classList.remove('active');
    li.style.borderLeftColor = 'transparent';
  });
}

function selectOrganelle(id) {
  if (selectedId === id) { clearSelection(); return; }
  selectedId = id;
  const org = ORGANELLES.find(o => o.id === id);
  if (!org) return;

  document.querySelectorAll('.org-group').forEach(g => {
    [...g.classList].filter(c => c.startsWith('anim-')).forEach(c => g.classList.remove(c));
    if (g.dataset.organelleId === id) {
      g.classList.remove('dimmed');
      g.classList.add(org.animClass);
    } else {
      g.classList.add('dimmed');
    }
  });

  const badgeStyle = org.colorPaleVar
    ? `background: var(${org.colorPaleVar}); color: var(${org.colorVar}); border-color: var(${org.colorVar});`
    : `background: var(--cream); color: var(--ink); border-color: var(--rule-mid);`;

  const foundInText = org.foundIn
    .map(t => t === 'prokaryote' ? 'Prokaryotic cell' : t.charAt(0).toUpperCase() + t.slice(1) + ' cell')
    .join(', ');

  document.getElementById('infoPanel').innerHTML = `
    <span class="info-badge" style="${badgeStyle}">${org.name}</span>
    <div class="info-name">${org.name}</div>
    ${org.nickname ? `<div class="info-nickname">${org.nickname}</div>` : ''}
    <p class="info-desc">${org.description}</p>
    <div class="info-found">Found in: ${foundInText}</div>
  `;

  document.querySelectorAll('.organelle-list-item').forEach(li => {
    li.classList.toggle('active', li.dataset.organelleId === id);
    if (li.dataset.organelleId === id) {
      li.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      li.style.borderLeftColor = org.colorPaleVar ? `var(${org.colorVar})` : 'var(--ink)';
    } else {
      li.style.borderLeftColor = 'transparent';
    }
  });
}

function attachSvgListeners() {
  document.querySelectorAll('.org-group').forEach(g => {
    g.addEventListener('click', () => selectOrganelle(g.dataset.organelleId));
  });
}

// ── Task 9: Organelle List Renderer ──

function renderOrganelleList(type) {
  const list = document.getElementById('organelleList');
  const forType = ORGANELLES.filter(o => o.foundIn.includes(type));
  list.innerHTML = forType.map(org => {
    const dotStyle = org.colorPaleVar
      ? `background: var(${org.colorVar});`
      : `background: var(--muted);`;
    return `
      <li class="organelle-list-item" data-organelle-id="${org.id}" style="cursor:pointer">
        <span class="org-dot" style="${dotStyle}"></span>
        <span>${org.name}</span>
      </li>`;
  }).join('');

  list.querySelectorAll('.organelle-list-item').forEach(item => {
    item.addEventListener('click', () => {
      selectOrganelle(item.dataset.organelleId);
    });
  });
}

renderCell('animal');

document.querySelectorAll('.cell-tab').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.cell-tab').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    renderCell(btn.dataset.cell);
  });
});
</script>
